<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f3f3f3;
    padding: 20px;
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 18px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 12px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 8px;
}

.resumo {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
}

.total-entrada { color: green; }
.total-saida { color: red; }
.saldo { font-weight: bold; font-size: 18px; }

ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

li {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
}

.entrada { color: green; }
.saida { color: red; }
</style>
</head>

<body>

<h1>Controle Financeiro</h1>

<div class="card">
<h3>Adicionar Entrada</h3>
<input type="text" id="origemEntrada" placeholder="De onde entrou">
<input type="number" id="valorEntrada" placeholder="Valor">
<button onclick="adicionarEntrada()">Adicionar Entrada</button>
</div>

<div class="card">
<h3>Adicionar Saída</h3>
<input type="text" id="nomeSaida" placeholder="Do que saiu">
<input type="number" id="valorSaida" placeholder="Valor">
<button onclick="adicionarSaida()">Adicionar Saída</button>
</div>

<div class="card">
<div class="resumo total-entrada">
<span>Total Entradas:</span>
<span id="totalEntradas">R$ 0</span>
</div>

<div class="resumo total-saida">
<span>Total Saídas:</span>
<span id="totalSaidas">R$ 0</span>
</div>

<div class="resumo saldo">
<span>Saldo:</span>
<span id="saldo">R$ 0</span>
</div>
</div>

<div class="card">
<h3>Lançamentos</h3>
<ul id="lista"></ul>
</div>

<script>
let entradas = JSON.parse(localStorage.getItem("entradas")) || [];
let saidas = JSON.parse(localStorage.getItem("saidas")) || [];

function salvar() {
    localStorage.setItem("entradas", JSON.stringify(entradas));
    localStorage.setItem("saidas", JSON.stringify(saidas));
}

function adicionarEntrada() {
    let origem = document.getElementById("origemEntrada").value;
    let valor = parseFloat(document.getElementById("valorEntrada").value);

    if (origem && !isNaN(valor)) {
        entradas.push({ origem, valor });
        document.getElementById("origemEntrada").value = "";
        document.getElementById("valorEntrada").value = "";
        atualizar();
    }
}

function adicionarSaida() {
    let nome = document.getElementById("nomeSaida").value;
    let valor = parseFloat(document.getElementById("valorSaida").value);

    if (nome && !isNaN(valor)) {
        saidas.push({ nome, valor });
        document.getElementById("nomeSaida").value = "";
        document.getElementById("valorSaida").value = "";
        atualizar();
    }
}

function atualizar() {
    salvar();

    let totalEntradas = entradas.reduce((acc, item) => acc + item.valor, 0);
    let totalSaidas = saidas.reduce((acc, item) => acc + item.valor, 0);
    let saldo = totalEntradas - totalSaidas;

    document.getElementById("totalEntradas").innerText = "R$ " + totalEntradas.toFixed(2);
    document.getElementById("totalSaidas").innerText = "R$ " + totalSaidas.toFixed(2);
    document.getElementById("saldo").innerText = "R$ " + saldo.toFixed(2);

    let lista = document.getElementById("lista");
    lista.innerHTML = "";

    entradas.forEach(item => {
        lista.innerHTML += `<li class="entrada">+ ${item.origem} — R$ ${item.valor.toFixed(2)}</li>`;
    });

    saidas.forEach(item => {
        lista.innerHTML += `<li class="saida">- ${item.nome} — R$ ${item.valor.toFixed(2)}</li>`;
    });
}

atualizar();
</script>

</body>
</html>
